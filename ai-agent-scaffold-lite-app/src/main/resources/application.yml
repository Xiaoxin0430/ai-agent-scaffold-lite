spring:
  config:
    name: ai-agent-scaffold-lite-app
    import: optional:file:./.env[.properties]
  profiles:
    active: dev
  datasource:
    url: ${RAG_DB_URL:jdbc:postgresql://127.0.0.1:15432/ai_agent_scaffold_lite}
    username: ${RAG_DB_USERNAME:ai_agent}
    password: ${RAG_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: Rag_HikariCP
      minimum-idle: 1
      maximum-pool-size: 10
      idle-timeout: 180000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  servlet:
    multipart:
      max-file-size: ${RAG_MAX_FILE_SIZE:20MB}
      max-request-size: ${RAG_MAX_REQUEST_SIZE:25MB}
  flyway:
    enabled: ${RAG_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 4

# RAG 文档切分配置
rag:
  router:
    enabled: ${RAG_ROUTER_ENABLED:true}
  chat:
    min-similarity: ${RAG_CHAT_MIN_SIMILARITY:0.35}
  chunking:
    target-tokens: 600
    max-tokens: 800
    overlap-tokens: 100
    version: v1
    encoding: CL100K_BASE
  embedding:
    base-url: ${AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${ALiYun_API:}
    embeddings-path: ${AI_EMBEDDINGS_PATH:/embeddings}
    model: ${AI_EMBEDDING_MODEL:qwen3.7-text-embedding-flash}
    dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
    batch-size: ${AI_EMBEDDING_BATCH_SIZE:20}
    version: ${AI_EMBEDDING_VERSION:v1}
  vector-store:
    default-top-k: ${RAG_SEARCH_TOP_K:5}
    max-top-k: ${RAG_SEARCH_MAX_TOP_K:50}
    default-min-similarity: ${RAG_SEARCH_MIN_SIMILARITY:0.0}
  generation:
    base-url: ${AI_CHAT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${ALiYun_API:}
    completions-path: ${AI_CHAT_COMPLETIONS_PATH:/chat/completions}
    model: ${AI_CHAT_MODEL:qwen3.8-27b}
    max-context-characters: ${RAG_MAX_CONTEXT_CHARACTERS:12000}

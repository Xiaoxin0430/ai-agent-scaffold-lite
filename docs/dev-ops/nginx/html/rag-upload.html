<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>群智工坊 · 上传文档</title>
    <style>
      :root { color-scheme: light; --text: #20242b; --muted: #5f6670; --border: #e8eaed; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: var(--text); font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial; background: #f8f9fb; }
      .page { max-width: 800px; margin: 0 auto; padding: 36px 20px; }
      .back { color: #4f5965; text-decoration: none; font-size: 14px; }
      .back:hover { color: #20242b; text-decoration: underline; }
      .panel { margin-top: 24px; padding: 32px; border: 1px solid var(--border); border-radius: 14px; background: #ffffff; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { color: var(--muted); line-height: 1.7; font-size: 14px; }
      label { display: block; margin: 24px 0 10px; font-size: 14px; }
      input[type=file] { display: block; width: 100%; padding: 20px; border: 1px dashed #b8c2cd; border-radius: 10px; background: #f8f9fb; color: var(--text); }
      input[type=file]:focus-visible { outline: 3px solid #edf1f5; border-color: #8998a9; }
      input[type=file]::file-selector-button { margin-right: 14px; padding: 8px 12px; border: 1px solid #dfe3e8; border-radius: 7px; background: #ffffff; color: var(--text); cursor: pointer; }
      button { margin-top: 20px; padding: 12px 20px; border: 0; border-radius: 9px; background: #242a32; color: #ffffff; font-weight: 700; cursor: pointer; }
      button:hover { filter: brightness(1.12); }
      button:disabled { opacity: .55; cursor: progress; }
      #status { margin-top: 20px; min-height: 24px; white-space: pre-wrap; word-break: break-word; }
      #status.error { color: #c94444; }
      #result { display: none; margin-top: 18px; padding: 16px; border: 1px solid #dce9df; border-radius: 10px; background: #f5faf6; font-size: 13px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
      @media (max-width: 600px) { .page { padding: 22px 14px; } .panel { padding: 22px 18px; } }
    </style>
  </head>
  <body>
    <div class="page">
      <a class="back" href="./index.html">← 返回对话</a>
      <main class="panel">
        <h1>上传文档</h1>
        <p>选择本地文档。上传后服务端会自动解析、切分并写入知识库；完成后即可在对话中提问。</p>
        <form id="uploadForm">
          <label for="file">选择文件</label>
          <input id="file" name="file" type="file" required />
          <button id="uploadButton" type="submit">上传并入库</button>
        </form>
        <div id="status" role="status" aria-live="polite"></div>
        <div id="result"></div>
      </main>
    </div>
    <script src="js/config.js"></script>
    <script>
      const cookie = document.cookie.split("; ").find((item) => item.startsWith("ai_agent_login="));
      let login;
      try { login = JSON.parse(decodeURIComponent(cookie ? cookie.slice(cookie.indexOf("=") + 1) : "")); } catch { login = null; }
      const userId = login && login.user ? String(login.user) : "";
      if (!userId) window.location.replace("./login.html");
      const apiBase = (window.APP_CONFIG && window.APP_CONFIG.API_BASE) || "http://127.0.0.1:8091";
      const form = document.getElementById("uploadForm");
      const fileInput = document.getElementById("file");
      const button = document.getElementById("uploadButton");
      const status = document.getElementById("status");
      const result = document.getElementById("result");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const file = fileInput.files[0];
        if (!file) return;
        button.disabled = true;
        status.classList.remove("error");
        status.textContent = "正在上传、解析并入库，请稍候…";
        result.style.display = "none";
        const documentId = crypto.randomUUID();
        const data = new FormData();
        data.append("file", file);
        data.append("userId", userId);
        try {
          const response = await fetch(`${apiBase}/api/v1/rag/documents/${encodeURIComponent(documentId)}/index`, { method: "POST", body: data });
          const raw = await response.text();
          let payload;
          try { payload = JSON.parse(raw); } catch { throw new Error(`HTTP ${response.status}`); }
          if (!response.ok || payload.code !== "0000" || !payload.data) {
            throw new Error(payload.info || `HTTP ${response.status}`);
          }
          status.textContent = "文档已入库，可以返回对话提问。";
          result.textContent = `文件：${payload.data.fileName}\n文档 ID：${payload.data.documentId}\n切片数：${payload.data.chunkCount}`;
          result.style.display = "block";
          fileInput.value = "";
        } catch (error) {
          status.classList.add("error");
          status.textContent = `上传失败：${error.message || error}`;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
